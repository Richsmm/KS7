name: KS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
